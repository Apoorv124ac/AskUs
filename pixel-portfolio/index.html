<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
    <title>Office Quest - a portfolio you can play</title>
    <meta name="description" content="Office Quest is a retro platformer that tells the career story of Apoorv Chaurasia, Specialist Graphic Designer. Play it in your browser." />
    <meta name="theme-color" content="#0f0f1b" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Office Quest - a portfolio you can play" />
    <meta property="og:description" content="Stomp bugs, meet the team and beat the dragon. A pixel-art game about the career of Apoorv Chaurasia." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%230f0f1b'/%3E%3Crect x='2' y='1' width='4' height='3' fill='%23e8b890'/%3E%3Crect x='2' y='1' width='4' height='1' fill='%231b1512'/%3E%3Crect x='1' y='4' width='6' height='3' fill='%232a2a48'/%3E%3Crect x='4' y='4' width='1' height='3' fill='%23e4002b'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #0f0f1b; overflow: hidden; }
      #game { width: 100vw; height: 100vh; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
      #notice { display: none; position: fixed; left: 8px; right: 64px; top: 8px; z-index: 9; padding: 6px 10px; background: #1c2250; color: #fcfcfc; border: 2px solid #f8d878; font: 12px/1.4 monospace; text-align: center; }
      @media (pointer: coarse) { #notice { display: block; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="notice" onclick="this.remove()">Tip: turn your phone sideways for the best view. Tap to hide.</div>
    <noscript><p style="color:#fff;font-family:monospace;padding:16px">Office Quest needs JavaScript enabled.</p></noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
