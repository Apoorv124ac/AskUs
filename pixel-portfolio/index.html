<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0F0F1B" />
  <meta name="description" content="Office Quest - a playable pixel-platformer portfolio." />
  <title>Office Quest</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%230F0F1B'/%3E%3Ccircle cx='4' cy='4' r='3' fill='%23F8D878'/%3E%3C/svg%3E" />
  <style>
    :root { --ink: #0F0F1B; --paper: #FCFCFC; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
    body { display: flex; align-items: center; justify-content: center; font-family: 'Press Start 2P', monospace; }
    #stage { position: relative; line-height: 0; }
    #stage canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    /* optional CRT scanline overlay (toggle with C or from the pause menu) */
    #crt { position: absolute; inset: 0; pointer-events: none; display: none;
      background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.22) 2px, rgba(0,0,0,.22) 3px);
      box-shadow: inset 0 0 40px rgba(0,0,0,.45); }
    body.crt #crt { display: block; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--paper); font-size: 12px; background: var(--ink); z-index: 5; }
    #boot.hide { display: none; }
    noscript { color: #fff; font: 14px monospace; padding: 20px; }

    /* ---------- touch controls (shown on touch devices only) ---------- */
    #touch { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 4; font-family: 'Press Start 2P', monospace; }
    body.touch #touch { display: block; }
    #touch button { pointer-events: auto; touch-action: none; -webkit-tap-highlight-color: transparent; color: var(--paper);
      background: rgba(15,15,27,.55); border: 3px solid rgba(252,252,252,.75); border-radius: 12px; font: inherit; font-size: 14px; }
    #touch button.on { background: rgba(88,216,84,.7); }
    #dpad { position: absolute; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); width: 168px; height: 168px; display: grid;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 4px; }
    #dpad button { border-radius: 10px; }
    #dpad [data-a="jump"]  { grid-area: 1 / 2; }
    #dpad [data-a="left"]  { grid-area: 2 / 1; }
    #dpad [data-a="right"] { grid-area: 2 / 3; }
    #dpad [data-a="down"]  { grid-area: 3 / 2; }
    #abtns { position: absolute; right: max(12px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom)); display: flex; gap: 14px; align-items: flex-end; }
    #abtns button { width: 76px; height: 76px; border-radius: 50%; font-size: 18px; }
    #abtns [data-a="jump"] { margin-bottom: 36px; }
    #sys { position: absolute; top: max(6px, env(safe-area-inset-top)); right: max(6px, env(safe-area-inset-right)); display: flex; gap: 8px; }
    #sys button { width: 44px; height: 44px; font-size: 11px; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="boot">LOADING...</div>
  <div id="stage"><div id="game"></div><div id="crt"></div></div>
  <div id="touch" aria-label="On-screen controls">
    <div id="sys">
      <button data-a="mute" aria-label="Mute">M</button>
      <button data-a="interact" aria-label="Interact">OK</button>
      <button data-a="pause" aria-label="Pause">II</button>
    </div>
    <div id="dpad">
      <button data-a="jump" aria-label="Up / jump">&#9650;</button>
      <button data-a="left" aria-label="Left">&#9664;</button>
      <button data-a="right" aria-label="Right">&#9654;</button>
      <button data-a="down" aria-label="Down / enter pipe">&#9660;</button>
    </div>
    <div id="abtns">
      <button data-a="run" aria-label="B: run">B</button>
      <button data-a="jump" data-also="confirm" aria-label="A: jump">A</button>
    </div>
  </div>
  <noscript>Office Quest needs JavaScript. A classic resume link will live here.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
